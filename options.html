<!doctype html>
<html><head><meta charset="utf-8"><title>MetaTruth Profiles</title>
<style>body{font:15px system-ui;max-width:760px;margin:30px auto;padding:0 20px}textarea{width:100%;height:240px;font:13px monospace}button{padding:9px 12px;border-radius:8px;border:1px solid #aaa;margin-top:10px}</style>
</head><body>
<h1>🕵️ Bones & ⚖️ Remedy Control Room</h1>
<p>Paste JSON to configure presence profiles. This MVP flags pages containing configured targets; it does not claim a contradiction merely because a target is mentioned.</p>
<textarea id="profiles"></textarea><br>
<button id="save">Save Profiles</button>
<button id="preview">Preview Naughty List</button>
<pre id="out"></pre>
<script>
const box=document.getElementById("profiles");
chrome.storage.local.get("metaTruthProfiles", d => box.value=JSON.stringify(d.metaTruthProfiles||[],null,2));
document.getElementById("save").onclick=()=>{
  try{
    const v=JSON.parse(box.value);
    chrome.storage.local.set({metaTruthProfiles:v},()=>alert("Profiles stored. The filing cabinet survived."));
  }catch(e){alert("JSON error: "+e.message)}
};
document.getElementById("preview").onclick=()=>{
  chrome.storage.local.get("naughtyList", d => document.getElementById("out").textContent =
    JSON.stringify(d.naughtyList||[],null,2));
};
</script></body></html>
